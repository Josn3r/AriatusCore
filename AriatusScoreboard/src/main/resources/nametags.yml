groups:
  Owner:
    permission: "ariatuscore.prefix.owner"
    tabprefix: "&0&l[&a&lOwner&0&l] &a"
    tagprefix: "&2&lOwner &a"

  VIP:
    permission: "ariatuscore.prefix.vip"
    tabprefix: "&0&l[&7&lVIP&0&l] &3"
    tagprefix: "&2&lPlayer &3"

  _DEFAULT_:
    tabprefix: "%perm-prefix%"
    tagprefix: "%perm-prefix%"

suffixs:
  VNZLA:
    permission: "ariatuscore.suffix.vnzla"
    tabsuffix: "&aTesteo"
    tagsuffix: "&3Tes&ateo"

  NONE:
    tabsuffix: ""
    tagsuffix: ""

settings:
  update-ticks: 20
  default-group: "_DEFAULT_"
  default-suffix: "NONE"
  tabname-format: "%tabprefix%%player_name%%tabsuffix%"
  nametag-format:
    prefix: "%tagprefix%"
    suffix: "%tagsuffix%"